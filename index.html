<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OsoMovil - Rastreo Escolar</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

  <!-- PANTALLA DE LOGIN -->
  <div id="pantalla-login" class="flex-grow flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl w-full max-w-sm text-center space-y-6">
      <div class="bg-white p-3 rounded-2xl inline-block shadow-md">
        <span class="text-4xl">🚌</span>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-amber-500 uppercase tracking-wide">OsoMovil</h1>
        <p class="text-xs text-slate-400 mt-1">Selecciona la ruta de hoy</p>
      </div>

      <div id="mensaje-error" class="hidden bg-red-950/80 border border-red-500 text-red-300 p-3 rounded-xl text-xs text-left break-words"></div>

      <form id="form-login" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">ID / Matrícula Alumno:</label>
          <input type="text" id="id_alumno" required placeholder="Ej. 0001" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-amber-500 outline-none uppercase" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">NIP de Acceso:</label>
          <input type="password" id="nip" required placeholder="••••" maxlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-amber-500 outline-none" />
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Ruta a Monitorear:</label>
          <select id="ruta_seleccionada" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-amber-500 outline-none cursor-pointer">
            <option value="La Loma II">La Loma II</option>
            <option value="Coco Pacifico">Coca Pacifico</option>
          </select>
        </div>

        <button type="submit" id="btn-ingresar" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition-colors mt-2">
          Ver Ubicación
        </button>
      </form>
    </div>
  </div>

  <!-- PANTALLA DEL MAPA -->
  <div id="pantalla-mapa" class="hidden flex-col h-screen w-full relative">
    <header class="absolute top-4 left-4 right-4 z-[1000] bg-slate-800/90 backdrop-blur border border-slate-700 p-4 rounded-2xl shadow-xl flex justify-between items-center">
      <div>
        <span id="info-ruta" class="text-xs font-bold text-amber-400 uppercase tracking-wider">Cargando...</span>
        <h2 id="info-alumno" class="text-sm font-bold text-white">Alumno</h2>
      </div>
      <button onclick="cerrarSesion()" class="bg-slate-700 hover:bg-red-900/80 border border-slate-600 text-xs px-3 py-1.5 rounded-xl text-slate-200">
        Salir
      </button>
    </header>

    <div id="map" class="h-full w-full bg-slate-950 z-0"></div>
  </div>

  <script>
    // 👇👇 REEMPLAZA CON TU URL Y TU CLAVE ANON (eyJ...) 👇👇
    const SUPABASE_URL = 'https://ejxuwmfesmgqegofkuh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqeHV3eG1mZXNtcWdlZ29ma3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTQxNDQsImV4cCI6MjEwMDQ3MDE0NH0.44i3oXzeWQpz1U7w5EcyBu3Q04vHhuefZnc-ntxXPMs';
    // 👆👆 ======================================================= 👆👆
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map = null;
    let busMarker = null;
    let intervalId = null;
    let rutaActiva = '';

    const formLogin = document.getElementById('form-login');
    const pantallaLogin = document.getElementById('pantalla-login');
    const pantallaMapa = document.getElementById('pantalla-mapa');
    const mensajeError = document.getElementById('mensaje-error');

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensajeError.classList.add('hidden');
      
      const idAlumno = document.getElementById('id_alumno').value.trim();
      const nip = document.getElementById('nip').value.trim();
      rutaActiva = document.getElementById('ruta_seleccionada').value;

      // 1. Validar accesos
      const { data, error } = await db
        .from('osomovil_accesos')
        .select('*')
        .eq('id_alumno', idAlumno)
        .eq('nip', nip)
        .maybeSingle();

      if (error) {
        console.error("Error en Supabase:", error);
        mensajeError.textContent = `⚠️ Error de conexion: ${error.message}`;
        mensajeError.classList.remove('hidden');
        return;
      }

      if (!data) {
        mensajeError.textContent = '❌ ID o NIP incorrectos. Verifica tus datos.';
        mensajeError.classList.remove('hidden');
        return;
      }

      // 2. REGISTRAR EN LA BITÁCORA
      const bitacoraRes = await db.from('osomovil_bitacora').insert([{
        id_alumno: idAlumno,
        nip_usado: nip,
        ruta_seleccionada: rutaActiva
      }]);

      if (bitacoraRes.error) {
        console.warn("Aviso bitácora:", bitacoraRes.error.message);
      }

      // 3. Entrar al mapa
      document.getElementById('info-ruta').textContent = `Ruta: ${rutaActiva}`;
      document.getElementById('info-alumno').textContent = `Alumno: ${idAlumno}`;

      pantallaLogin.classList.add('hidden');
      pantallaMapa.classList.remove('hidden');
      pantallaMapa.classList.add('flex');

      inicializarMapa();
      iniciarRastreo();
    });

    function inicializarMapa() {
      if(map) { map.remove(); }
      map = L.map('map', { zoomControl: false }).setView([19.2826, -99.6556], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      const busIcon = L.divIcon({
        html: '<div style="font-size: 32px; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));">🚌</div>',
        className: 'bus-custom-icon',
        iconSize: [35, 35],
        iconAnchor: [17, 17]
      });

      busMarker = L.marker([19.2826, -99.6556], { icon: busIcon }).addTo(map);
    }

    function iniciarRastreo() {
      actualizarPosicionBus();
      intervalId = setInterval(actualizarPosicionBus, 3000);
    }

    async function actualizarPosicionBus() {
      const { data } = await db
        .from('osomovil_gps')
        .select('*')
        .eq('nombre_ruta', rutaActiva)
        .maybeSingle();

      if (data && data.latitud && data.longitud) {
        const nuevaPos = [data.latitud, data.longitud];
        busMarker.setLatLng(nuevaPos);
        map.panTo(nuevaPos);
      }
    }

    function cerrarSesion() {
      if (intervalId) clearInterval(intervalId);
      pantallaMapa.classList.add('hidden');
      pantallaMapa.classList.remove('flex');
      pantallaLogin.classList.remove('hidden');
      document.getElementById('nip').value = '';
    }
  </script>
</body>
</html>
